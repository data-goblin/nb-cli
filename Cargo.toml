[package]
name = "nb-fabric"
version = "0.4.4"
edition = "2021"
description = "CLI for managing Microsoft Fabric notebooks; create, edit cells, execute interactively, schedule, and query OneLake data"
license = "GPL-3.0"
repository = "https://github.com/data-goblin/nb-cli"
homepage = "https://github.com/data-goblin/nb-cli"
keywords = ["fabric", "notebook", "pyspark", "onelake", "duckdb"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**/*.rs", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[[bin]]
name = "nb"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.0", features = ["derive"] }
reqwest = { version = "=0.12.28", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tokio = { version = "=1.50.0", features = ["macros", "rt-multi-thread", "time", "signal"] }
base64 = "=0.22.1"
anyhow = "=1.0.102"
