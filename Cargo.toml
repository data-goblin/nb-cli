[package]
name = "nb"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nb"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
